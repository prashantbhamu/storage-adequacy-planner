# Builds the Windows download, checks it end to end with the example year and,
# for a version tag (v*), attaches StorageAdequacyPlanner-windows.zip to that
# GitHub release. Pull requests that change the app get a test build too, and
# it can be run by hand from the Actions tab.
name: Windows app

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["backend/**", "frontend/**", "examples/**", "packaging/**", "requirements.txt",
            ".github/workflows/windows-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the interface
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Package the app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm packaging/windows/planner.spec

      - name: Check the packaged app
        shell: pwsh
        run: |
          $env:PLANNER_NO_BROWSER = "1"
          $env:PLANNER_PORT = "8790"
          $app = Start-Process -FilePath "dist/Storage Adequacy Planner/Storage Adequacy Planner.exe" -PassThru
          try { python packaging/windows/check_app.py http://127.0.0.1:8790 }
          finally { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Storage Adequacy Planner" -DestinationPath StorageAdequacyPlanner-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StorageAdequacyPlanner-windows
          path: StorageAdequacyPlanner-windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Storage Adequacy Planner $tag" --notes-file packaging/windows/RELEASE_NOTES.md }
          gh release upload $tag StorageAdequacyPlanner-windows.zip --clobber
